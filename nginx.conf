server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text goes out compressed. The phone scene's three.js bundle is ~670 KB on its own,
    # and nginx ships with gzip off, so without this every visitor downloaded all of it.
    # Images are webp/jpg and already compressed, so they are left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page asks for the bundles with a version in the URL (?v=...), so a long hold is safe.
    location /js/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Self-hosted fonts never change under the same name.
    location /fonts/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Screenshots keep their names when they are replaced, so these are held for a week
    # rather than a year: a new screenshot reaches people within days, not months.
    location ~* \.(webp|jpg|jpeg|png|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }
}
